name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore TwitchySharp.slnx
      - name: Build
        run: dotnet build TwitchySharp.slnx --no-restore -c Release
      - name: Unit tests
        run: |
          set -euo pipefail
          mapfile -t projects < <(find tests/Unit -name '*.Tests.Unit.csproj' | sort)
          for proj in "${projects[@]}"; do
            dotnet test "$proj" --no-build -c Release
          done
