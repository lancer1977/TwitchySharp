name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: twitchysharp-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate
        run: ./scripts/validate.sh
