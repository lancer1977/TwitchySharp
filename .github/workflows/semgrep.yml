name: Semgrep

# Fork-only workflow (lancer1977/TwitchySharp#5).
# Runs on the self-hosted validation runner only. Fork PRs are skipped; there
# is no GitHub-hosted fallback. The publish runner is never used here.

on:
  pull_request:
    branches:
      - polyhydra/publish
  push:
    branches:
      - polyhydra/publish

permissions:
  contents: read

jobs:
  semgrep:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, nuget-twitchysharp]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install semgrep
        run: |
          pip install --user --break-system-packages semgrep
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run semgrep (fail on ERROR-severity findings only)
        env:
          # Self-hosted runner memlock limit breaks semgrep-core io_uring setup;
          # force the portable Eio backend.
          EIO_BACKEND: posix
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          baseline_args=()
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            baseline_args=(--baseline-commit "${BASE_SHA}")
          fi
          semgrep scan \
            --config p/default \
            --config p/security-audit \
            --error \
            --severity ERROR \
            --sarif --output semgrep.sarif \
            "${baseline_args[@]}" \
            .

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore
