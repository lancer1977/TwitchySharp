name: Polyhydra NuGet publish

# Fork-only workflow (lancer1977/TwitchySharp#1).
# Branch pushes and PRs: test + pack + verify on the self-hosted validation
# runner (nuget-twitchysharp). Fork PRs are skipped, never run on a hosted
# fallback. A v* tag (e.g. v0.1.0-preview.1) additionally publishes to nuget.org from the
# sky-catchy runner, which only receives the finished packages and never
# checks out or executes repository code.

on:
  push:
    branches:
      - polyhydra/publish
    tags:
      - 'v*'
  pull_request:
    branches:
      - polyhydra/publish

concurrency:
  group: polyhydra-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  package:
    # Same-repository PRs only; fork PRs are skipped (no hosted fallback).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, nuget-twitchysharp]
    timeout-minutes: 30
    outputs:
      package_version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Compute version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.1.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag must look like v1.2.3 or v1.2.3-preview.4; got '${GITHUB_REF_NAME}'."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Package version ${version}"

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          find tests/Unit -name '*.Tests.Unit.csproj' -print0 |
            while IFS= read -r -d '' proj; do
              dotnet test "$proj" --configuration Release
            done

      - name: Pack
        run: eng/pack.sh "${{ steps.version.outputs.version }}" publish-out

      - name: Verify packages
        run: python3 -I eng/verify-packages.py publish-out "${{ steps.version.outputs.version }}"

      - name: Hand off packages to the publish job
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: publish-out
          key: polyhydra-twitchysharp-packages-${{ github.run_id }}

  publish-nuget-org:
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, nuget-twitchysharp-publish]
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      PACKAGE_VERSION: ${{ needs.package.outputs.package_version }}
    steps:
      - name: Start from an empty workspace
        shell: bash
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: 10.0.x

      - name: Receive packages from the package job
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: publish-out
          key: polyhydra-twitchysharp-packages-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Verify handed-off packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(publish-out/*.nupkg)
          if [[ ${#files[@]} -ne 8 ]]; then
            echo "::error::Expected 8 packages, found ${#files[@]}: ${files[*]:-(none)}"
            exit 1
          fi
          for f in "${files[@]}"; do
            name="$(basename "$f")"
            if [[ "$name" != PolyhydraGames.TwitchySharp.*".${PACKAGE_VERSION}.nupkg" ]]; then
              echo "::error::Unexpected package $name"
              exit 1
            fi
          done

      - name: Refuse to re-publish an existing version
        shell: bash
        run: |
          set -euo pipefail
          index_url="https://api.nuget.org/v3-flatcontainer/polyhydragames.twitchysharp.core/index.json"
          http_code="$(curl --silent --show-error --output versions.json --write-out '%{http_code}' "$index_url")"
          if [[ "$http_code" == "404" ]]; then
            echo "No versions on nuget.org yet; first publish of ${PACKAGE_VERSION}."
            exit 0
          fi
          if [[ "$http_code" != "200" ]]; then
            echo "::error::Unable to query nuget.org version index (HTTP ${http_code})."
            exit 1
          fi
          if python3 -I -c 'import json,sys; sys.exit(0 if sys.argv[1].lower() in json.load(open("versions.json"))["versions"] else 1)' "$PACKAGE_VERSION"; then
            echo "::error::${PACKAGE_VERSION} is already on nuget.org."
            exit 1
          fi

      - name: Authenticate to nuget.org
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: lancer1977

      - name: Publish to nuget.org
        shell: bash
        run: |
          set -euo pipefail
          # Push dependencies first so each package's deps already exist.
          for id in Core Api Api.Authentication Api.Helix EventSub EventSub.Webhooks EventSub.Webhooks.AspNetCore EventSub.Websocket; do
            dotnet nuget push "publish-out/PolyhydraGames.TwitchySharp.${id}.${PACKAGE_VERSION}.nupkg" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --skip-duplicate
          done
